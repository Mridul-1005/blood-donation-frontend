<!-- shared/navbar/navbar.component.html -->
<mat-toolbar class="navbar">

  <!-- Brand -->
  <a routerLink="/requests" class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
    <span class="brand-text">BloodLink</span>
  </a>

  <span class="spacer"></span>

  <!-- Desktop Nav Links -->
  <div class="nav-links">

    <!-- Always visible -->
    <a mat-button class="nav-link" routerLink="/requests" routerLinkActive="active-link">
      <mat-icon>assignment</mat-icon>
      <span>Requests</span>
    </a>
    <a mat-button class="nav-link" routerLink="/inventory" routerLinkActive="active-link">
      <mat-icon>inventory_2</mat-icon>
      <span>Inventory</span>
    </a>

    <!-- Not logged in -->
    <ng-container *ngIf="!authService.isLoggedIn()">
      <a mat-button class="nav-link" routerLink="/login" routerLinkActive="active-link">Login</a>
      <a mat-raised-button class="register-btn" routerLink="/register">
        <mat-icon>person_add</mat-icon>
        <span>Register</span>
      </a>
    </ng-container>

    <!-- Logged in -->
    <ng-container *ngIf="authService.isLoggedIn()">

      <!-- Donor only -->
      <ng-container *ngIf="authService.isDonor()">
        <a mat-button class="nav-link" routerLink="/donor/dashboard" routerLinkActive="active-link">
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </a>
      </ng-container>

      <!-- Admin only -->
      <ng-container *ngIf="authService.isAdmin()">
        <a mat-button class="nav-link" routerLink="/admin/dashboard" routerLinkActive="active-link">
          <mat-icon>admin_panel_settings</mat-icon>
          <span>Admin</span>
        </a>
      </ng-container>

      <!-- User menu -->
      <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-trigger">
        <div class="user-avatar">
          {{ authService.getName()?.charAt(0)?.toUpperCase() }}
        </div>
      </button>

      <mat-menu #userMenu="matMenu" class="user-menu">
        <div class="menu-header">
          <div class="menu-avatar">{{ authService.getName()?.charAt(0)?.toUpperCase() }}</div>
          <div class="menu-user-info">
            <strong>{{ authService.getName() }}</strong>
            <span class="menu-role">{{ authService.getRole() }}</span>
          </div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item routerLink="/profile" class="menu-item">
          <mat-icon>person</mat-icon>
          <span>My Profile</span>
        </button>
        <ng-container *ngIf="authService.isDonor()">
          <button mat-menu-item routerLink="/donor/donations" class="menu-item">
            <mat-icon>favorite</mat-icon>
            <span>My Donations</span>
          </button>
        </ng-container>
        <button mat-menu-item routerLink="/requests/my" class="menu-item">
          <mat-icon>assignment</mat-icon>
          <span>My Requests</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()" class="menu-item logout-item">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>

    </ng-container>
  </div>

</mat-toolbar>
