# Application Name
spring.application.name=blood-donation

# MySQL Connection - supports environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blood_donate?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings (for production scalability)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration - must be provided via environment variable
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration - comma-separated list of allowed origins
# Default is Angular dev server, CHANGE IN PRODUCTION to your domain
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Server Configuration
server.port=${SERVER_PORT:8081}

# Production Profile Settings (activate with spring.profiles.active=production)
# DO NOT set ddl-auto=create in production!
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}