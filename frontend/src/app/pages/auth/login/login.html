<!-- pages/auth/login/login.component.html -->
<div class="auth-page">
  <div class="auth-background">
    <div class="bg-gradient"></div>
    <div class="bg-pattern"></div>
  </div>

  <div class="auth-container">
    <mat-card class="auth-card">

      <!-- Header -->
      <div class="auth-header">
        <div class="auth-logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your BloodLink account</p>
      </div>

      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <!-- Email -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email Address</mat-label>
            <input matInput type="email" formControlName="email" placeholder="you@example.com">
            <mat-icon matSuffix>mail</mat-icon>
            <mat-error *ngIf="email?.hasError('required') && email?.touched">Email is required</mat-error>
            <mat-error *ngIf="email?.hasError('email') && email?.touched">Enter a valid email address</mat-error>
          </mat-form-field>

          <!-- Password -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
            <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" class="password-toggle">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="password?.hasError('required') && password?.touched">Password is required</mat-error>
          </mat-form-field>

          <!-- Forgot Password Link -->
          <div class="forgot-password-link">
            <a routerLink="/forgot-password">Forgot Password?</a>
          </div>

          <!-- Submit Button -->
          <button
            mat-raised-button
            color="primary"
            type="submit"
            class="full-width submit-btn"
            [disabled]="loginForm.invalid || isLoading">
            <ng-container *ngIf="isLoading">
              <mat-spinner diameter="20"></mat-spinner>
            </ng-container>
            <ng-container *ngIf="!isLoading">
              <span>Sign In</span>
            </ng-container>
          </button>

        </form>
      </mat-card-content>

      <!-- Footer -->
      <div class="auth-footer">
        <p>Don't have an account? <a routerLink="/register">Create one</a></p>
      </div>

    </mat-card>

    <!-- Trust Indicators -->
    <div class="trust-bar">
      <div class="trust-item">
        <mat-icon>verified</mat-icon>
        <span>Verified Network</span>
      </div>
      <div class="trust-item">
        <mat-icon>security</mat-icon>
        <span>Secure Login</span>
      </div>
      <div class="trust-item">
        <mat-icon>support_agent</mat-icon>
        <span>24/7 Support</span>
      </div>
    </div>
  </div>
</div>
